name: iconmind_flutter
description: >-
  1,041 open-source icons for AI-era software — agents, MCP, RAG, prompts —
  as tree-shakeable Flutter widgets. Outline and duotone, three weights,
  drawn from the same source of truth as every other IconMind package.
version: 0.3.3
homepage: https://iconmind.vercel.app
repository: https://github.com/Iconmind/iconmind
issue_tracker: https://github.com/Iconmind/iconmind/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  path_drawing: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
