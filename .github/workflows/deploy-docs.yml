name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/icons/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Same reasoning as release.yml — enable by setting the repository variable once the
    # Vercel credentials are in place.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4      # version comes from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Built here rather than by Vercel: the site needs the icon packages built first,
      # and turbo already knows that graph. Vercel receives finished static output and
      # has nothing left to guess about.
      - run: pnpm build --filter=docs...
      - run: pnpm icons:index

      - name: Deploy to Vercel
        run: |
          pnpm dlx vercel@latest deploy apps/docs/out \
            --prod --yes --archive=tgz \
            --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
