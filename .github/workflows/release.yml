name: Release

# Fully automatic: any push to main that touches the packages (or the scripts
# that generate them) becomes a release. No PR round-trip — the workflow writes
# a changeset if the push didn't bring one, versions the fixed group, commits
# the bump back to main, publishes all packages to npm, pushes the tags, and
# cuts a GitHub Release. The version-bump push uses the default GITHUB_TOKEN,
# which never retriggers workflows, so there is no loop — and Vercel (a
# separate GitHub App) still sees that push and redeploys the site with the
# new version number.
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/**"
      - ".changeset/**"

concurrency: release-${{ github.ref }}

permissions:
  contents: write        # version-bump commit, tags, GitHub Release
  id-token: write        # npm provenance

jobs:
  release:
    # Belt and braces: the release commit itself must never release again.
    if: "!startsWith(github.event.head_commit.message, 'chore: release v') && !contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # The same gate CI runs — nothing publishes that the validator has not passed.
      - run: pnpm icons:build
      - run: pnpm icons:optimize
      - run: pnpm icons:validate
      - run: git diff --exit-code || (echo "::error::pipeline is not deterministic — refusing to publish" && exit 1)
      # The gate rebuilds cells in their raw, pre-canonical form. Left in the tree, the
      # version-bump's `git add -A` committed all 6,246 of them — which is exactly what
      # v0.3.2's release commit did, and why every local rebuild then showed the whole
      # set as modified. The gate proves; it must not publish its scratch work.
      - run: git checkout -- .

      - name: Ensure a changeset exists
        run: node .github/scripts/auto-changeset.mjs
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Bump versions
        run: pnpm changeset version

      - name: Commit the bump back to main
        id: bump
        run: |
          VERSION=$(node -p "require('./packages/icons/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release v$VERSION"
          git push

      # setup-node's registry-url points NPM_CONFIG_USERCONFIG at its own .npmrc, which
      # reads the token from NODE_AUTH_TOKEN — so that env var is the ONLY place npm will
      # look. A hand-written ~/.npmrc was tried first and silently ignored; every publish
      # then failed E404, which is how npm spells "unauthorised" for scoped packages.
      - name: Build and publish to npm
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # @iconmind/mcp needs the icon data at runtime, so its range is plain semver rather
      # than workspace: — which means a bumped range sends pnpm to the registry. Patch
      # releases no longer touch it (updateInternalDependencies: minor), but a minor one
      # does, and a stale lockfile fails every frozen-lockfile install afterwards: our own
      # CI, and Vercel's build. Hence *after* publish — the version it must resolve is on
      # the registry only once the step above has run. A no-op when nothing changed.
      - name: Refresh the lockfile if the bump moved an internal range
        run: |
          for i in 1 2 3; do
            pnpm install --lockfile-only && break
            echo "registry has not caught up yet; retrying in 15s"
            sleep 15
          done
          git diff --quiet -- pnpm-lock.yaml && echo "lockfile unchanged" && exit 0
          # A follow-up commit, never an amend: main's tip is already published and
          # already building on Vercel. pnpm-lock.yaml is outside this workflow's paths
          # filter, so this cannot retrigger a release.
          git add pnpm-lock.yaml
          git commit -m "chore: refresh lockfile for v${{ steps.bump.outputs.version }}"
          git pull --rebase --autostash && git push

      - name: Push tags and cut the GitHub Release
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git tag -f "v$VERSION"
          git push origin --tags --force
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes || \
            echo "release v$VERSION already exists"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
