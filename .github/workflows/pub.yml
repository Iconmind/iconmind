name: pub.dev

# Publishes iconmind_flutter after each release. pub.dev's automated publishing takes an
# OIDC token from GitHub Actions and accepts it only for a run on a tag that matches the
# pattern set on the package's admin page, `v{{version}}`. The Release workflow pushes
# its tags with GITHUB_TOKEN, which starts no workflow, so it dispatches this one on the
# new tag instead: workflow_dispatch is the one event GITHUB_TOKEN may trigger.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # pub.dev OIDC

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - uses: actions/checkout@v4
      # Writes the pub.dev token from the OIDC exchange; flutter pub reads the same config.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter pub publish --force
